<meta name="color-scheme" content="light">
<meta name="description" content="Manual interactivo de Economía Mexicana PAPIME. Territorio, recursos y estructura productiva.">
<script>window.MathJax = {tex: {tags: 'ams'}, svg: {fontCache: 'global'}, options: {enableMenu: false}};</script>
<script>
// Cada explorador informa su altura para conservar la lectura continua del libro.
window.addEventListener('message', function(event) {
  if (!event.data || event.data.type !== 'papime:resize') return;
  var h = Number(event.data.height);
  if (!Number.isFinite(h) || h < 200 || h > 50000) return;
  document.querySelectorAll('iframe.territorio').forEach(function(frame) {
    if (frame.contentWindow === event.source && Math.abs(frame.getBoundingClientRect().height-h)>3) {
      frame.style.height = Math.ceil(h+4)+'px';
      frame.setAttribute('data-altura-ajustada','true');
    }
  });
});
</script>
