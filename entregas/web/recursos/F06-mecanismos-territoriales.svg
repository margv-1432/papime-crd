<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-label="F06-mecanismos-territoriales"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Calibri,sans-serif"><text x="35" y="45" font-size="32" fill="#0F4761" font-weight="700" text-anchor="start">Mecanismos territoriales</text><text x="35" y="80" font-size="22" fill="#56616B" font-weight="400" text-anchor="start">Síntesis interpretativa de las relaciones desarrolladas en el capítulo</text><text x="35" y="115" font-size="17" fill="#56616B" font-weight="400" text-anchor="start">Elaboración propia con apoyo en FAO (1993), Geurs y van Wee (2004), Gasca (2014), Bray et al. (2003) y Aburto-Oropeza et al. (2008).</text><line x1="345" y1="445" x2="395" y2="445" stroke="#0F4761" stroke-width="2.3"/><path d="M395.0,445.0L383.0,440.0L383.0,450.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="715" y1="445" x2="765" y2="445" stroke="#0F4761" stroke-width="2.3"/><path d="M765.0,445.0L753.0,440.0L753.0,450.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="1085" y1="445" x2="1135" y2="445" stroke="#0F4761" stroke-width="2.3"/><path d="M1135.0,445.0L1123.0,440.0L1123.0,450.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><rect x="35" y="380" width="310" height="155" rx="8" fill="#EAF2F6" stroke="#0F4761"/><text x="190.0" y="418" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">Condiciones</text><text x="190.0" y="446" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">geográficas</text><text x="190.0" y="493" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Relieve y localización</text><text x="190.0" y="518" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Clima, agua, suelos y recursos</text><rect x="405" y="380" width="310" height="155" rx="8" fill="#EAF2F6" stroke="#0F4761"/><text x="560.0" y="418" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">Acceso</text><text x="560.0" y="446" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">efectivo</text><text x="560.0" y="493" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Medios de conexión</text><text x="560.0" y="518" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Calidad y costos de utilización</text><rect x="775" y="380" width="310" height="155" rx="8" fill="#EAF2F6" stroke="#0F4761"/><text x="930.0" y="418" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">Aprovechamiento</text><text x="930.0" y="493" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Actividades y transformación</text><text x="930.0" y="518" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Vínculos entre territorios</text><rect x="1145" y="380" width="310" height="155" rx="8" fill="#EAF2F6" stroke="#0F4761"/><text x="1300.0" y="418" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">Resultados</text><text x="1300.0" y="446" font-size="25" fill="#0F4761" font-weight="700" text-anchor="middle">territoriales</text><text x="1300.0" y="493" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Empleo e ingresos</text><text x="1300.0" y="518" font-size="18" fill="#24313A" font-weight="400" text-anchor="middle">Beneficios y cargas</text><rect x="35" y="190" width="310" height="74" rx="6" fill="#F6F8F9" stroke="#A5BAC6"/><text x="190.0" y="219" font-size="22" fill="#0F4761" font-weight="700" text-anchor="middle">Infraestructura</text><text x="190.0" y="246" font-size="16" fill="#24313A" font-weight="400" text-anchor="middle">Captación, conducción y transporte</text><rect x="405" y="190" width="310" height="74" rx="6" fill="#F6F8F9" stroke="#A5BAC6"/><text x="560.0" y="219" font-size="22" fill="#0F4761" font-weight="700" text-anchor="middle">Tecnología y manejo</text><text x="560.0" y="246" font-size="16" fill="#24313A" font-weight="400" text-anchor="middle">Requerimientos de un uso definido</text><rect x="775" y="190" width="310" height="74" rx="6" fill="#F6F8F9" stroke="#A5BAC6"/><text x="930.0" y="219" font-size="22" fill="#0F4761" font-weight="700" text-anchor="middle">Organización productiva</text><text x="930.0" y="246" font-size="16" fill="#24313A" font-weight="400" text-anchor="middle">Gestión, transformación y reinversión</text><rect x="1145" y="190" width="310" height="74" rx="6" fill="#F6F8F9" stroke="#A5BAC6"/><text x="1300.0" y="219" font-size="22" fill="#0F4761" font-weight="700" text-anchor="middle">Derechos y decisiones</text><text x="1300.0" y="246" font-size="16" fill="#24313A" font-weight="400" text-anchor="middle">Reglas, participación y distribución</text><line x1="190" y1="264" x2="190" y2="320" stroke="#0F4761" stroke-width="2.3"/><line x1="190" y1="320" x2="480" y2="320" stroke="#0F4761" stroke-width="2.3"/><line x1="480" y1="320" x2="480" y2="380" stroke="#0F4761" stroke-width="2.3"/><path d="M480.0,380.0L485.0,368.0L475.0,368.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="560" y1="264" x2="560" y2="380" stroke="#0F4761" stroke-width="2.3"/><path d="M560.0,380.0L565.0,368.0L555.0,368.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="930" y1="264" x2="930" y2="380" stroke="#0F4761" stroke-width="2.3"/><path d="M930.0,380.0L935.0,368.0L925.0,368.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="1300" y1="264" x2="1300" y2="380" stroke="#0F4761" stroke-width="2.3"/><path d="M1300.0,380.0L1305.0,368.0L1295.0,368.0Z" fill="#0F4761" stroke="#0F4761" stroke-width="0.8"/><line x1="930" y1="535" x2="930" y2="625" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><line x1="1300" y1="535" x2="1300" y2="625" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><path d="M1300.0,625.0L1305.0,613.0L1295.0,613.0Z" fill="#A34F26" stroke="#A34F26" stroke-width="0.8"/><line x1="930" y1="625" x2="1115" y2="625" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><line x1="1300" y1="625" x2="1115" y2="625" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><rect x="775" y="650" width="680" height="80" rx="8" fill="#FBF3ED" stroke="#A34F26"/><text x="1115" y="685" font-size="24" fill="#A34F26" font-weight="700" text-anchor="middle">Conservación o degradación de la base natural</text><text x="1115" y="715" font-size="17" fill="#24313A" font-weight="400" text-anchor="middle">El manejo y las cargas afectan condiciones de aprovechamiento futuro</text><line x1="1115" y1="625" x2="1115" y2="650" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><path d="M1115.0,650.0L1120.0,638.0L1110.0,638.0Z" fill="#A34F26" stroke="#A34F26" stroke-width="0.8"/><line x1="775" y1="690" x2="190" y2="690" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><line x1="190" y1="690" x2="190" y2="535" stroke="#A34F26" stroke-width="2.3" stroke-dasharray="8 5"/><path d="M190.0,535.0L185.0,547.0L195.0,547.0Z" fill="#A34F26" stroke="#A34F26" stroke-width="0.8"/><text x="420" y="730" font-size="19" fill="#A34F26" font-weight="400" text-anchor="middle">Retorno hacia condiciones futuras</text><text x="35" y="805" font-size="21" fill="#56616B" font-weight="400" text-anchor="start">Cada flecha propone una relación cuyo alcance y magnitud deben estudiarse en el territorio.</text></g></svg>